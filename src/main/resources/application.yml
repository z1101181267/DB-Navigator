server:
  port: 8080

spring:
  application:
    name: db-navigator

  # H2 embedded database for driver metadata registry
  # Embedded registry database (auto-created on first start)
  datasource:
    url: jdbc:h2:file:./data/registry;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# ---- DB Navigator custom configuration ----
dbnav:
  # Driver directory root (drivers/<db_type>/<version>/<jar>)
  drivers-dir: ./drivers

  # Data directory (for H2 registry DB and connection configs)
  data-dir: ./data

  # Connection pool defaults (HikariCP)
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

  # Driver seed file (imported only when the registry table is empty)
  drivers-seed: classpath:drivers-seed.json

  # Database types definition
  db-types-config: classpath:db-types.json

  # 巡检模板种子（报告骨架：模板 → 章节 → 引用哪些规则）
  inspection-templates: classpath:inspection/templates.json

  # 巡检规则库种子（规则正文，跨模板共享）
  inspection-rules: classpath:inspection/rules.json

  # 配置基线种子（内置默认阈值）
  inspection-baselines: classpath:inspection/baselines.json
